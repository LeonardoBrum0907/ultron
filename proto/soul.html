<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ULTRON — soul eater</title>
    <style>
      :root {
        --cyan: #19ddff;
        --amber: #ffb54d;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        color: var(--cyan);
        font-family: 'Share Tech Mono', Consolas, 'Courier New', monospace;
        overflow: hidden;
      }
      canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .hud { position: fixed; pointer-events: none; letter-spacing: 0.16em; text-transform: uppercase; transition: opacity 0.6s ease; }
      .title { top: 22px; left: 28px; font-size: 22px; letter-spacing: 0.5em; opacity: 0.9; }
      .title small { display: block; margin-top: 8px; font-size: 10px; letter-spacing: 0.3em; opacity: 0.45; }
      .status { top: 26px; right: 28px; text-align: right; font-size: 11px; opacity: 0.8; line-height: 1.8; }
      .status b { color: var(--amber); font-weight: normal; }
      .hint { bottom: 18px; left: 16px; right: 16px; text-align: center; font-size: 10px; opacity: 0.32; }
      .summon { bottom: 15%; left: 0; right: 0; text-align: center; font-size: 13px; letter-spacing: 0.5em; opacity: 0.6; }
      body.bare .hud { opacity: 0 !important; }
      #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; color: #ff8a65; padding: 40px; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>

    <div class="hud title">U.L.T.R.O.N.<small>soul eater</small></div>
    <div class="hud status">soul: <b id="mode">dust</b><br />palette: <b id="palette">blue</b><br />mic: <b id="mic">off</b><br /><span id="count"></span></div>
    <div class="hud summon" id="summon">click to summon</div>
    <div class="hud hint">click to summon, then to flare · the cursor pushes the particles aside · D dissolve · R summon again · P palette · M microphone · H hide text · A avatar · U back to Ultron</div>

    <div id="err"></div>
    <script type="module" src="./soul/main.js"></script>
  </body>
</html>
